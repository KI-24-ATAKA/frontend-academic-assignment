<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">CSS Lab</title>
  <desc id="description">Окно редактора с CSS-кодом и схема блочной модели</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d47ff"/>
      <stop offset="1" stop-color="#32217d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22283a"/>
      <stop offset="1" stop-color="#151925"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
  <circle cx="1040" cy="84" r="180" fill="#9f8aff" opacity=".22"/>
  <circle cx="110" cy="650" r="230" fill="#77f2c6" opacity=".13"/>
  <rect x="70" y="78" width="650" height="560" rx="28" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".14"/>
  <circle cx="112" cy="116" r="9" fill="#ff7a88"/>
  <circle cx="142" cy="116" r="9" fill="#ffc857"/>
  <circle cx="172" cy="116" r="9" fill="#7ce3b3"/>
  <text x="110" y="190" fill="#a893ff" font-family="Consolas, monospace" font-size="31" font-weight="700">.card {</text>
  <text x="145" y="244" fill="#7ce3b3" font-family="Consolas, monospace" font-size="27">box-sizing:</text>
  <text x="355" y="244" fill="#ffffff" font-family="Consolas, monospace" font-size="27">border-box;</text>
  <text x="145" y="294" fill="#7ce3b3" font-family="Consolas, monospace" font-size="27">width:</text>
  <text x="270" y="294" fill="#ffffff" font-family="Consolas, monospace" font-size="27">100%;</text>
  <text x="145" y="344" fill="#7ce3b3" font-family="Consolas, monospace" font-size="27">padding:</text>
  <text x="295" y="344" fill="#ffffff" font-family="Consolas, monospace" font-size="27">24px;</text>
  <text x="145" y="394" fill="#7ce3b3" font-family="Consolas, monospace" font-size="27">border:</text>
  <text x="285" y="394" fill="#ffffff" font-family="Consolas, monospace" font-size="27">1px solid;</text>
  <text x="110" y="448" fill="#a893ff" font-family="Consolas, monospace" font-size="31" font-weight="700">}</text>
  <rect x="790" y="105" width="330" height="510" rx="28" fill="#ffffff" fill-opacity=".96"/>
  <rect x="836" y="155" width="238" height="360" rx="22" fill="#f2c36b"/>
  <rect x="864" y="190" width="182" height="290" rx="18" fill="#ef8b72"/>
  <rect x="895" y="226" width="120" height="218" rx="14" fill="#8f73ff"/>
  <rect x="925" y="270" width="60" height="130" rx="10" fill="#ffffff"/>
  <text x="955" y="340" text-anchor="middle" fill="#32217d" font-family="Arial, sans-serif" font-size="20" font-weight="700">content</text>
  <text x="955" y="464" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">padding</text>
  <text x="955" y="505" text-anchor="middle" fill="#6b2830" font-family="Arial, sans-serif" font-size="18" font-weight="700">border</text>
  <text x="955" y="550" text-anchor="middle" fill="#674b18" font-family="Arial, sans-serif" font-size="18" font-weight="700">margin</text>
  <rect x="92" y="524" width="560" height="74" rx="18" fill="#ffffff" fill-opacity=".08"/>
  <text x="122" y="570" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">cascade → box model → rendered page</text>
